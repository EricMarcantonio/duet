[package]
name = "duet"
version = "0.3.0"
edition = "2024"
description = "Share Mac audio across two pairs of AirPods, with per-pair volume."

[lib]
name = "duet"
path = "src/lib.rs"

[[bin]]
name = "duet"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
opt-level = "s"
lto = true

# macOS native backends (src/audio/coreaudio.rs, src/audio/bluetooth.rs)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"

# Windows backend (src/audio/windows.rs): WASAPI, IPolicyConfig, WinRT Bluetooth.
# Linux (src/audio/linux.rs) shells out to pactl / bluetoothctl; its only crate is libc (below).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
]
# `#[windows_core::interface]` (used for IPolicyConfig) expands to paths in `windows_core`.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

# Linux AirPods controls (src/audio/linux.rs): raw L2CAP socket for Apple's AAP protocol.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
