name: Release

# Push a tag like v0.1.0 to build Duet for every OS and attach it to the GitHub release.
# Asset names are linked from the website (site/src/main.rs) and README: keep them in sync.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it doesn't exist
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Duet $TAG" --generate-notes ||
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

  macos:
    name: macOS (universal)
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus CLI 0.7.10
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force || cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build Duet.app and zip it
        run: ./scripts/bundle-macos.sh --zip
      - name: Check the binary is universal
        run: lipo -archs target/dx/duet/bundle/macos/macos/Duet.app/Contents/MacOS/duet
      - name: Upload
        run: gh release upload "$TAG" dist/Duet-macOS.zip --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows (experimental)
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The UI's CSS is compiled into the binary, so the .exe is the whole app.
      - run: cargo build --release --bin duet
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/Duet | Out-Null
          Copy-Item target/release/duet.exe pkg/Duet/Duet.exe
          Copy-Item README.md, LICENSE pkg/Duet/
          Compress-Archive -Path pkg/Duet -DestinationPath Duet-Windows.zip -Force
      - name: Upload
        shell: bash
        run: gh release upload "$TAG" Duet-Windows.zip --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    name: Linux (experimental)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin duet
      - name: Package
        run: |
          mkdir -p pkg/Duet
          cp target/release/duet pkg/Duet/duet
          cp assets/icon/256x256.png pkg/Duet/duet.png
          cp README.md LICENSE pkg/Duet/
          cat > pkg/Duet/INSTALL.txt <<'EOF'
          Duet for Linux (experimental, untested on real hardware).

          Runtime requirements: WebKitGTK 4.1, GTK 3, libayatana-appindicator3,
          pactl (pipewire-pulse on PipeWire systems) and bluetoothctl.
          Debian/Ubuntu: sudo apt install libwebkit2gtk-4.1-0 libayatana-appindicator3-1 pulseaudio-utils bluez

          Run: ./duet
          EOF
          tar -C pkg -czf Duet-Linux.tar.gz Duet
      - name: Upload
        run: gh release upload "$TAG" Duet-Linux.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
